services:
  # ─── Node.js Backend API ───────────────────────────────────────────────────
  - type: web
    name: billionaire-ai-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEON_DATABASE_URL
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PYTHON_SERVICE_URL
        sync: false

  # ─── Python FastAPI Data Service ──────────────────────────────────────────
  - type: web
    name: billionaire-ai-data-service
    runtime: python
    rootDir: data-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: NEON_DATABASE_URL
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: BACKEND_URL
        sync: false
